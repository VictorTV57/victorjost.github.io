# Met le portfolio en ligne sur https://victorjost.github.io à chaque push sur main
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permet aussi de lancer le déploiement à la main depuis l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Construire le site Astro
        uses: withastro/action@v3 # détecte npm / pnpm / yarn tout seul
        with:
          node-version: 24 # Astro 7 demande Node 22.12 ou plus (l'action utilise Node 20 par défaut)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
